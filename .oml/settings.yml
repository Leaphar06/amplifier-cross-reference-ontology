# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@leaphar06/amplifier-cross-reference-method"
  version: 0.2.0
  title: Amplifier Cross Reference Method
  description: Vocabulary, editor templates, analysis views, and a cross-reference report generator for classifying TI amplifier replacements.

# source folders
sources:
  - src

# packing settings: only the reusable method ships
pack:
  - include: [src/method]

# oml-cli parameter defaults
defaults:
  pack: -o build/dist
  render: -m src/model/md -b build/web -c src/model/oml/leaphar06.github.io/amplifier-cross-reference-ontology/description-bundle.oml
